{% extends "base.html" %}

{% block content %}
<section class="login-shell">
    <div class="login-left">
        <div class="login-form-wrap">
            <h2 class="login-heading">Create account</h2>
            <p class="login-subtext">Register now to access AI-powered medical predictions.</p>

            {% if register_error %}<div class="msg error">{{ register_error }}</div>{% endif %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="field">
                    <label for="register-name">Name</label>
                    <input id="register-name" type="text" name="name" required>
                </div>
                <div class="field">
                    <label for="register-bmdc">BMDC Registration Number</label>
                    <input id="register-bmdc" type="text" name="bmdc" required>
                </div>
                <div class="field">
                    <label for="register-email">Email</label>
                    <input id="register-email" type="email" name="email" required>
                </div>
                <div class="field">
                    <label for="register-password">Password</label>
                    <input id="register-password" type="password" name="password" required>
                </div>
                <div class="field">
                    <label for="register-confirm-password">Confirm Password</label>
                    <input id="register-confirm-password" type="password" name="confirm_password" required>
                </div>
                <button type="submit" class="action-btn">Register</button>
            </form>

            <div class="login-create">
                Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
            </div>
        </div>
    </div>

    <div class="login-right">
        <img src="{{ url_for('pic_file', filename='Register.png') }}" alt="Doctor register image">
        
    </div>
</section>
{% endblock %}
