<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc. Assistant - Medical AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --green-deep: #0d5f58;
            --green-accent: #0f7469;
            --text-dark: #214240;
            --surface: #eaf2f2;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--surface);
            background-image:
                radial-gradient(1200px 620px at 8% -6%, rgba(15, 116, 105, 0.24) 0%, rgba(15, 116, 105, 0) 56%),
                radial-gradient(980px 580px at 92% -12%, rgba(13, 95, 88, 0.18) 0%, rgba(13, 95, 88, 0) 52%),
                radial-gradient(880px 520px at 50% 112%, rgba(14, 133, 120, 0.10) 0%, rgba(14, 133, 120, 0) 56%),
                repeating-linear-gradient(
                    -45deg,
                    rgba(255, 255, 255, 0.12) 0px,
                    rgba(255, 255, 255, 0.12) 1px,
                    rgba(255, 255, 255, 0) 1px,
                    rgba(255, 255, 255, 0) 14px
                ),
                linear-gradient(160deg, #f7fcfc 0%, #eef6f6 42%, #e4eeee 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
        }

        .navbar {
            background: var(--green-deep);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar h1 {
            color: #fff;
            margin: 0;
            font-size: 24px;
            font-family: "Playfair Display", Georgia, serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
            background: #fff;
        }

        .nav-links { display: flex; gap: 16px; flex-wrap: wrap; }
        .nav-btn {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 2px;
            border-bottom: 2px solid transparent;
        }
        .nav-btn:hover, .nav-btn.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        .container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 26px 40px;
        }

        .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        .msg.error { background: #fdecec; color: #8a1f1f; border: 1px solid #f1b4b4; }
        .msg.success { background: #ebf8ee; color: #1f6d2f; border: 1px solid #b8dfbf; }

        .premium-shell, .login-shell {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            display: grid;
            align-items: center;
            gap: 20px;
            margin-top: 26px;
            box-shadow: 0 10px 24px rgba(18, 55, 52, 0.08);
        }
        .premium-shell { grid-template-columns: 1.1fr 1fr; }
        .login-shell { grid-template-columns: 1fr 1fr; }
        .premium-left, .login-left { border-radius: 12px; padding: 14px; }
        .premium-right, .login-right {
            border-radius: 12px;
            overflow: hidden;
            min-height: 430px;
            background: #e5ebe9;
        }
        .premium-right img, .login-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero h2 {
            margin: 0 0 8px;
            font-family: "Playfair Display", Georgia, serif;
            font-size: 34px;
            color: var(--text-dark);
        }
        .hero p { margin: 0; color: #55716e; line-height: 1.6; }

        .field { margin-bottom: 14px; }
        .field label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #355855; }
        .field input, .field select {
            width: 100%;
            padding: 11px 12px;
            border-radius: 8px;
            border: 1px solid #c7d2d0;
            background: #fff;
            font-size: 14px;
        }
        .google-btn {
            width: 100%;
            border: 1px solid #cad7d4;
            border-radius: 8px;
            padding: 11px 12px;
            color: var(--text-dark);
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
        .google-btn img { width: 18px; height: 18px; }
        .or-line { display: flex; align-items: center; margin: 18px 0; color: #98a2b3; font-size: 12px; letter-spacing: 1px; }
        .or-line::before, .or-line::after { content: ""; flex: 1; height: 1px; background: #d0d5dd; }
        .or-line span { margin: 0 12px; }
        .forgot-wrap { text-align: right; margin-top: -4px; margin-bottom: 14px; }
        .forgot-wrap a { color: var(--green-accent); text-decoration: none; font-size: 13px; }

        .action-btn, .predict-btn, .custom-file-upload {
            border: 0;
            background: var(--green-deep);
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .action-btn { width: 100%; }
        .login-create { margin-top: 16px; text-align: center; color: #667085; font-size: 14px; }
        .login-create a { color: var(--green-accent); text-decoration: none; font-weight: 600; }

        .upload-section {
            background: #f3f8f7;
            border: 1px dashed #8fb5b1;
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            margin-top: 20px;
        }
        input[type="file"] { display: none; }
        #file-name { display: block; margin: 8px 0 16px; color: #4b6965; font-style: italic; }
        .result { margin-top: 22px; padding: 16px; border-radius: 10px; background: #eef9ee; border: 1px solid #cde8cd; }
        .uploaded-preview { margin-top: 16px; text-align: center; }
        .uploaded-preview img { max-width: 360px; width: 100%; border-radius: 8px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); }
        .report-shell { grid-template-columns: 1fr; }
        .report-full { width: 100%; }
        .report-images {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: start;
        }
        .report-images .uploaded-preview { margin-top: 0; }
        .report-images .uploaded-preview img { max-width: 100%; height: auto; }

        .home-hero {
            background: var(--green-deep);
            color: #fff;
            padding: 48px 34px 60px;
            margin-top: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 24px;
        }
        .home-eyebrow {
            text-transform: uppercase;
            letter-spacing: 1.6px;
            font-size: 11px;
            margin-bottom: 10px;
            opacity: 0.86;
            font-weight: 600;
        }
        .home-title {
            margin: 0;
            font-family: "Playfair Display", Georgia, serif;
            font-size: 64px;
            line-height: 0.98;
            color: #fff;
        }
        .home-subtitle { margin: 10px 0 20px; font-size: 22px; font-family: "Playfair Display", Georgia, serif; }
        .home-cta {
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #fff;
            text-decoration: none;
            padding: 11px 24px;
            display: inline-block;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .home-hero-media { position: relative; min-height: 390px; }
        .hero-main-img {
            position: absolute;
            right: 0;
            top: 0;
            width: 74%;
            height: 340px;
            object-fit: cover;
        }
        .hero-overlay-img {
            position: absolute;
            left: 8%;
            top: 70px;
            width: 46%;
            height: 220px;
            object-fit: cover;
            border: 10px solid #fff;
        }

        .story-section {
            padding: 54px 6px 10px;
        }
        .story-heading {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 56px;
            line-height: 1.08;
            margin: 12px 0 26px;
            color: var(--green-deep);
            max-width: 850px;
        }
        .story-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 34px;
            align-items: end;
        }
        .story-grid img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 2px;
        }
        .story-card {
            background: #fff;
            padding: 0;
        }
        .story-card p { color: #4b6461; line-height: 1.7; margin: 14px 0 0; }

        @media (max-width: 900px) {
            .home-hero, .story-grid, .premium-shell { grid-template-columns: 1fr; }
            .report-images { grid-template-columns: 1fr; }
            .home-title { font-size: 46px; }
            .home-hero-media { min-height: 320px; }
            .hero-main-img { width: 88%; height: 260px; }
            .hero-overlay-img { width: 52%; height: 180px; }
            .navbar { padding: 14px 20px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
    <h1><img class="brand-logo" src="{{ url_for('pic_file', filename='Logo.png') }}" alt="Dr.Assistant Logo">Dr.Assistant</h1>
    <div class="nav-links">
        {% if doctor_nav %}
            <a class="nav-btn {% if active_page == 'doctor' %}active{% endif %}" href="{{ url_for('doctor_page') }}">Doctor</a>
            <a class="nav-btn {% if active_page == 'report' %}active{% endif %}" href="{{ url_for('report_page') }}">Report</a>
            
            <a class="nav-btn {% if active_page == 'history' %}active{% endif %}" href="/history">History</a>
            
            <a class="nav-btn" href="{{ url_for('logout') }}">Logout</a>
        {% else %}
            <a class="nav-btn {% if active_page == 'home' %}active{% endif %}" href="{{ url_for('home_page') }}">Home</a>
            <a class="nav-btn {% if active_page == 'login' %}active{% endif %}" href="{{ url_for('login') }}">Login</a>
            <a class="nav-btn {% if active_page == 'register' %}active{% endif %}" href="{{ url_for('register') }}">Register</a>
            <a class="nav-btn {% if active_page == 'about' %}active{% endif %}" href="{{ url_for('about_page') }}">About</a>
        {% endif %}
    </div>
</nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
